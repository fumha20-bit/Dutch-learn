<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch-Learn App</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #2196F3;
            --success-color: #4CAF50;
            --error-color: #F44336;
            --sidebar-bg: #1e293b;
            --sidebar-text: #f8fafc;
            --border-color: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Design */
        #sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .unit-nav-list {
            list-style: none;
            flex-grow: 1;
        }

        .unit-nav-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            background-color: #334155;
            font-weight: 500;
        }

        .unit-nav-item:hover, .unit-nav-item.active {
            background-color: var(--primary-color);
        }

        /* User State Actions Layout */
        .auth-mock {
            border-top: 1px solid #334155;
            padding-top: 15px;
        }

        .auth-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #475569;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* Main App Area */
        #main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .mode-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background-color: var(--container-bg);
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
        }

        .mode-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .theme-toggle-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        /* Workspace Cards Layout */
        .content-card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .vocab-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .audio-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Color Coding Exercises Elements */
        .interactive-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            margin-top: 10px;
            color: #000;
        }

        .correct-ans {
            background-color: #d1fae5 !important;
            border-color: var(--success-color) !important;
        }
