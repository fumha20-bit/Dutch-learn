<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch-Learn App</title>
<style>
:root {
  /* Changed to normal, clean light-mode colors */
  --bg-color: #eef2f3; 
  --container-bg: #ffffff;
  --text-color: #1e293b;
  --primary-color: #2196F3;
  --success-color: #4CAF50;
  --error-color: #F44336;
  --sidebar-bg: #1e293b;
  --sidebar-text: #f8fafc;
  --border-color: #e2e8f0;
}

[data-theme="dark"] {
  /* Smooth dark mode colors */
  --bg-color: #0f172a;
  --container-bg: #1e293b;
  --text-color: #f8fafc;
  --primary-color: #3b82f6;
  --border-color: #334155;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  display: flex;
  min-height: 100vh;
  transition: background-color 0.3s, color 0.3s;
}

/* Layout - Keeping your original design */
.sidebar {
  width: 260px;
  background-color: var(--sidebar-bg);
  color: var(--sidebar-text);
  padding: 2rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.sidebar h2 {
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
  text-align: center;
  color: #3b82f6;
}

/* Simple styling for the new switch button */
.theme-toggle-btn {
  background-color: var(--primary-color);
  color: white;
  border: none;
  padding: 0.6rem;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
  margin-bottom: 1.5rem;
  text-align: center;
}

.unit-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--sidebar-text);
  padding: 0.75rem 1rem;
  text-align: left;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
}

.unit-btn:hover {
  background-color: rgba(255, 255, 255, 0.1);
}
</style>
</head>
<body>

  <div class="sidebar">
    <h2>Dutch-Learn</h2>
    <button id="themeToggle" class="theme-toggle-btn">🌙 Switch Mode</button>
    
    <button class="unit-btn">Unit 1: Basis</button>
    <button class="unit-btn">Unit 2: Getallen</button>
    <button class="unit-btn">Unit 3: Zinnen</button>
  </div>

  <div style="flex: 1; padding: 2rem;">
    <h1>Welkom bij Dutch-Learn!</h1>
  </div>

  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateButtonText(currentTheme);

    themeToggleBtn.addEventListener('click', () => {
      let theme = document.documentElement.getAttribute('data-theme');
      theme = (theme === 'dark') ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      updateButtonText(theme);
    });

    function updateButtonText(theme) {
      themeToggleBtn.innerText = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
  </script>

</body>
</html>
